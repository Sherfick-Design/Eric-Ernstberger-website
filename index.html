<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="description" content="Paintings by Eric Ernstberger. A private development gallery by Sherfick Design."><meta name="theme-color" content="#000000"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22black%22/%3E%3Ctext%20x%3D%229%22%20y%3D%2243%22%20fill%3D%22white%22%20font-family%3D%22Arial%22%20font-size%3D%2230%22%3EEE%3C/text%3E%3C/svg%3E"><title>Eric Ernstberger — Paintings</title><link rel="stylesheet" href="styles.css"><script defer src="catalog.js"></script><script defer src="app.js"></script></head>
<body>
<main id="app">
<section id="landing" aria-label="Eric Ernstberger paintings"><div class="landing-content"><h1>ERIC<br>ERNSTBERGER</h1><p class="eyebrow">PAINTINGS</p><button id="enter" class="enter">ENTER GALLERY <span aria-hidden="true">→</span></button></div><span class="landing-corner">A DIGITAL EXHIBITION</span></section>

</section>
<p class="preview-label">Development Preview <span>— Sherfick Design</span></p>
</main>
